# One-off: the collect job of run 42665318250 (foot-spin) never started; fetch that run's clips and push them to its out branch.
name: Blender farm
on:
  push:
    branches: ['render/blend-*']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: clip-*
          merge-multiple: true
          run-id: '42665318250'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the clips back
        run: |
          cd out && ls -la > files.txt
          git init -q && git checkout -q -b out && git add -A
          git -c user.name=render-farm -c user.email=render-farm@users.noreply.github.com commit -qm "blend 20261109-113039-foot-spin (collected again)"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/render/out-20261109-113039-foot-spin
