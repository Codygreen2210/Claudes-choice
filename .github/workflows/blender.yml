# One-off: the collect job of run 42665318250 (foot-spin) never started; fetch that run's clips with the gh CLI and push them.
name: Blender farm
on:
  push:
    branches: ['render/blend-*']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the clips and push them back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl out && gh run download 42665318250 -R "${{ github.repository }}" -D dl
          find dl -type f -exec cp {} out/ \;
          cd out && ls -la > files.txt
          git init -q && git checkout -q -b out && git add -A
          git -c user.name=render-farm -c user.email=render-farm@users.noreply.github.com commit -qm "blend 20261109-113039-foot-spin (collected again)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/render/out-20261109-113039-foot-spin
