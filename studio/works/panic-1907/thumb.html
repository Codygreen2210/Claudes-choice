<!doctype html>
<meta charset="utf-8">
<style>
@font-face{font-family:Playfair;src:url(fonts/Playfair.ttf);font-weight:400 900}
@font-face{font-family:Playfair;src:url(fonts/Playfair-Italic.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:Fell;src:url(fonts/Fell.ttf)}
@font-face{font-family:Fell;src:url(fonts/Fell-Italic.ttf);font-style:italic}
@font-face{font-family:FellSC;src:url(fonts/FellSC.ttf)}
@font-face{font-family:OldStandard;src:url(fonts/OldStandard-Regular.ttf)}
@font-face{font-family:OldStandard;src:url(fonts/OldStandard-Bold.ttf);font-weight:bold}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="../../motion/kit.js"></script>
<script src="lib.js"></script>
<script>
// thumb.html: the film's thumbnail, drawn with the same kit. ?v=a (dark, key) or ?v=b (paper, locked door)
const { W, H, C, F, text, morgan, key, glow, hatch, rr, person, crowd, grain, vignette, tw } = L
const c = document.getElementById('cv').getContext('2d'), V = new URLSearchParams(location.search).get('v') || 'a'
function big(s, x, y, px, col, o = {}) { text(c, s, x, y, F.head(px, 900), col, { align: 'left', track: 2, stroke: o.stroke, sw: o.sw || 0, shadow: o.shadow, blur: 40, ...o }) }
window.__init = async () => { await Promise.all(['900 40px Playfair', 'italic 700 40px Playfair', '40px Fell', 'italic 40px Fell', '40px FellSC'].map(f => document.fonts.load(f))) }
window.__seek = () => {
  if (V === 'a') {
    // night: the man, the key, three words
    const g = c.createRadialGradient(560, 520, 60, 560, 520, 1300); g.addColorStop(0, '#7a4a22'); g.addColorStop(0.45, '#2e1c10'); g.addColorStop(1, '#070504'); c.fillStyle = g; c.fillRect(0, 0, W, H)
    hatch(c, k => k.rect(0, 0, W, H), { gap: 14, alpha: 0.12, angle: -0.5, col: '#f0c868', box: [0, 0, W, H] })
    glow(c, 520, 420, 900, '246,170,80', 0.5)
    // rim light, then the figure
    morgan(c, 342, 1250, 1240, { col: 'rgba(246,180,90,0.9)', arm: 0.62, cane: false, chain: false })
    morgan(c, 350, 1250, 1240, { col: '#080605', arm: 0.62, cane: false, chain: true })
    // the key, held up and lit
    glow(c, 790, 330, 520, '255,225,150', 0.85)
    key(c, 790, 255, 3.3, Math.PI / 2 - 0.12, C.gold2)
    big('LOCKED', 990, 400, 200, '#f4ead2', { shadow: '#000' })
    big('IN.', 990, 610, 200, '#e2452f', { shadow: '#000' })
    c.fillStyle = '#f0c868'; rr(c, 990, 700, 800, 118, 8); c.fill()
    text(c, 'THE PANIC OF 1907', 1390, 784, F.head(70, 900), '#140e0a', { track: 3 })
    text(c, 'the night one man saved Wall Street', 1390, 900, F.bodyI(52), '#f4ead2', { shadow: '#000' })
    vignette(c, 0.6)
  } else {
    // paper: the crowd of bankers against a locked door
    c.fillStyle = '#efe3c6'; c.fillRect(0, 0, W, H)
    hatch(c, k => k.rect(0, 0, W, H), { gap: 12, alpha: 0.10, angle: -0.5, box: [0, 0, W, H] })
    c.fillStyle = C.red; c.fillRect(0, 0, W, 1080); c.fillStyle = '#efe3c6'; c.fillRect(28, 28, W - 56, H - 56)
    // door
    c.fillStyle = '#1a1512'; c.fillRect(110, 150, 560, 930); c.fillStyle = '#5a3a22'; c.fillRect(140, 180, 500, 900)
    c.strokeStyle = '#2a190e'; c.lineWidth = 10; for (const [x, y, w, h] of [[180, 230, 190, 330], [410, 230, 190, 330], [180, 610, 190, 420], [410, 610, 190, 420]]) c.strokeRect(x, y, w, h)
    c.fillStyle = C.gold2; rr(c, 560, 520, 56, 150, 10); c.fill(); c.fillStyle = '#0a0705'; c.beginPath(); c.arc(588, 580, 13, 0, 7); c.fill(); c.fillRect(582, 580, 12, 40)
    crowd(7, 5, { h: 520, ladies: 0 }).forEach((p, i) => person(c, 110 + i * 92, 1120 + (i % 2) * 40, p.h, { hat: i % 2 ? 'top' : 'bowler', bulk: p.bulk, face: 1 }))
    big('NOBODY', 880, 340, 190, C.ink); big('LEAVES.', 880, 550, 190, C.red)
    c.fillStyle = C.ink; rr(c, 880, 640, 800, 118, 8); c.fill(); text(c, 'THE PANIC OF 1907', 1280, 724, F.head(70, 900), C.gold2, { track: 3 })
    key(c, 1720, 700, 1.3, 0, C.gold)
    text(c, 'J.P. Morgan locked the bankers in', 1280, 860, F.bodyI(56), C.ink2)
  }
  grain(c, 0, V === 'a')
}
</script>
