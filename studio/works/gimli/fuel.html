<!doctype html><meta charset="utf-8">
<style>@font-face{font-family:Playfair;src:url(../../motion/paint/fonts/Playfair.ttf);font-weight:400 900}html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
// The fuel math, animated: what the trip needed vs what was really in the tanks.
const c = cv.getContext('2d'), W = 1920, H = 1080
const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x) }
const p = (t, a, b) => sm((t - a) / (b - a))
window.__duration = 9
window.__init = async () => { await document.fonts.load('700 60px Playfair') }
function tank(x, label, fill, col, t, a) {
  const w = 380, h = 560, y = 260
  c.save(); c.globalAlpha = a
  c.strokeStyle = '#d7dde4'; c.lineWidth = 6; c.beginPath(); c.roundRect(x, y, w, h, 24); c.stroke()
  const fh = (h - 16) * fill
  const g = c.createLinearGradient(0, y + h - fh, 0, y + h); g.addColorStop(0, col[0]); g.addColorStop(1, col[1])
  c.fillStyle = g; c.beginPath(); c.roundRect(x + 8, y + h - 8 - fh, w - 16, fh, 16); c.fill()
  // a gentle wave on the fuel surface
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.beginPath(); c.moveTo(x + 8, y + h - 8 - fh)
  for (let k = 0; k <= 40; k++) c.lineTo(x + 8 + (w - 16) * k / 40, y + h - 8 - fh + Math.sin(k * 0.5 + t * 3) * 4)
  c.lineTo(x + w - 8, y + h - 8 - fh + 14); c.lineTo(x + 8, y + h - 8 - fh + 14); c.fill()
  c.font = '700 52px Playfair'; c.textAlign = 'center'; c.fillStyle = '#f3ead6'; c.fillText(label, x + w / 2, y - 40)
  c.restore()
}
window.__seek = t => {
  c.fillStyle = '#0d1014'; c.fillRect(0, 0, W, H)
  c.strokeStyle = 'rgba(120,150,180,0.08)'; c.lineWidth = 1; for (let x = 0; x < W; x += 60) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke() } for (let y = 0; y < H; y += 60) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke() }
  const a1 = p(t, 0, .6), a2 = p(t, 2.2, 2.8)
  tank(420, 'Needed', 1 * p(t, .3, 1.8), ['#e9b54a', '#a8741c'], t, a1)
  tank(1120, 'In the tanks', 0.45 * p(t, 2.6, 4.2), ['#e0483a', '#8a1c14'], t, a2)
  c.save(); c.textAlign = 'center'
  c.globalAlpha = p(t, 1.2, 1.8); c.font = '700 64px Playfair'; c.fillStyle = '#f3ead6'; c.fillText('22,300 kg', 610, 900)
  c.globalAlpha = p(t, 3.6, 4.2); c.fillStyle = '#ff7a6a'; c.fillText('about 10,100 kg', 1310, 900)
  // the wrong number that caused it
  const k = p(t, 5, 5.8); c.globalAlpha = k; c.font = 'italic 46px Playfair'; c.fillStyle = '#c9c2b0'
  c.fillText('they multiplied by 1.77  (pounds per litre)', W / 2, 990)
  c.globalAlpha = p(t, 6.6, 7.2); c.fillStyle = '#f3ead6'; c.fillText('instead of 0.80  (kilograms per litre)', W / 2, 1050)
  c.restore()
  const v = c.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); c.fillStyle = v; c.fillRect(0, 0, W, H)
}
</script>
