// thumb.html: the film's thumbnail. One dive bomber coming down on a red carrier, four words.
const { W, H, C, F, text, glow, grain, vignette } = L, c = document.getElementById('cv').getContext('2d')
window.__init = async () => { await Promise.all(['900 40px Playfair'].map(f => document.fonts.load(f))) }
window.__seek = () => {

  text(c, '5 MINUTES', 70, 250, F.head(240, 900), '#f4ead2', { align: 'left', track: 4, shadow: '#000', blur: 40 })
