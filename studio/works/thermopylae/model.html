<script>
const c = document.getElementById('cv').getContext('2d'), { W, H, C } = L
window.__init = async () => { await Promise.all(['900 40px Playfair', 'italic 40px Fell', '40px FellSC', 'bold 40px OldStandard'].map(f => document.fonts.load(f))) }
window.__seek = (t) => {
  L.paper(c, 0); c.strokeStyle = C.ink; c.lineWidth = 3; for (const y of [330, 660, 1000]) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke() }
  const P = ['guard', 'thrust', 'march', 'rest', 'comb', 'none']
  P.forEach((p, i) => TH.hoplite(c, 110 + i * 150, 330, 240, { pose: p, cloak: i % 2 === 0, helm: p !== 'comb', thrust: 1, t }))
  TH.hoplite(c, 1030, 330, 240, { pose: 'guard', down: 1, cloak: true })
  for (let k = 0; k < 8; k++) TH.hoplite(c, 1180 + k * 92, 330, 170, { pose: 'march', walk: k * Math.PI / 4, stride: 1, cloak: true })
  const Q = [['mede', 'stand'], ['mede', 'charge'], ['immortal', 'charge'], ['archer', 'bow'], ['mede', 'flee'], ['mede', 'whip']]
  Q.forEach(([k, p], i) => TH.persian(c, 110 + i * 150, 660, 240, { kind: k, pose: p, t, aim: p === 'bow' ? 0.3 : 0, draw: 1 }))
  TH.persian(c, 1030, 660, 240, { kind: 'mede', pose: 'charge', down: 1 })
  for (let k = 0; k < 8; k++) TH.persian(c, 1180 + k * 92, 660, 170, { pose: 'charge', walk: k * Math.PI / 4, stride: 1 })
  TH.xerxes(c, 220, 1000, 0.75, {}); TH.xerxes(c, 470, 1000, 0.75, { stand: 1 })

}
