<!doctype html>
<!-- The smallest possible studio page: a dot that travels, and a hard cut to a new colour at 1.5 s. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}</style>
<script src="../kit.js"></script></head>
<body><canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), g = c.getContext('2d')
window.__duration = 3
window.__init = () => { c.width = innerWidth; c.height = innerHeight }
window.__seek = t => {
  const W = c.width, H = c.height
  g.fillStyle = t < 1.5 ? '#1b1b3a' : '#e0592a'
  g.fillRect(0, 0, W, H)
  const x = K.lerp(0.15, 0.85, K.prog(t, 0, 3, 'io')) * W
  const y = H / 2 + K.noise(t * 2) * H * 0.2
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, W * 0.06, 0, Math.PI * 2); g.fill()
}
</script></body></html>
