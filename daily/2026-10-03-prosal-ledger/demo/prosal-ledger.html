<style>

   statement on the right like a sheet pulled from the ledger, the year's
   ledger across the bottom. One column on a phone. */

  --accent-ink: #ffffff;
  --accent-soft: #e0efe8;
  --warn: #8a5200;

  --neg: #a13a29;
  --head: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;

}
@media (prefers-color-scheme: dark) {

    --paper: #101614; --card: #171f1c; --ink: #e5ece8; --muted: #97a69f; --rule: #2a3531;

    --warn: #e3ab4e; --warn-soft: #30260f; --neg: #ef907d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101614; --card: #171f1c; --ink: #e5ece8; --muted: #97a69f; --rule: #2a3531;
  --accent: #5cc7a6; --accent-ink: #0b1512; --accent-soft: #16302a;

}

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 20px; }

p { margin: 0; }

.small { font-size: 13px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }

.docs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }

@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) { --paper: #fff; --card: #fff; --ink: #000; --muted: #444; --rule: #bbb; --accent: #0e6b54; --accent-soft: #eef5f2; --warn-soft: #f6f6f6; --neg: #000; color-scheme: light; }

  .printonly { display: flex; }
  .wrap { padding: 0; gap: 14px; }
  .grid { grid-template-columns: 1fr; }

<script type="module">
globalThis.PL_DEMO = true;
// ProSal Ledger: the pay math. Pure functions, whole cents, no dependencies.
// Runs the same in the browser and in the tests.
//
// ProSal in one line: the doctor is paid a guaranteed base, and earns a
// percentage of their production. When the percentage comes to more than the
// base already paid, the difference is the production bonus.

const CATEGORIES = [
  { id: 'services', label: 'Professional services', short: 'Services' },
  { id: 'lab', label: 'Lab work', short: 'Lab' },
  { id: 'pharmacy', label: 'Pharmacy', short: 'Pharmacy' },
  { id: 'preventives', label: 'Preventives', short: 'Preventives' },
  { id: 'other', label: 'Food, retail and other', short: 'Other' },
];

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// ---------- money and dates ----------

// "$39,000.50" -> 3900050. "(1,200)" and "-1200" are negative. Bad input -> null.
function toCents(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? Math.round(v * 100) : null;
  if (v == null) return null;
  let s = String(v).trim();
  if (s === '') return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,\s]/g, '');
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (!/^\d*(\.\d*)?$/.test(s) || s === '' || s === '.') return null;
  const [whole, frac = ''] = s.split('.');
  // Round on the third decimal by hand so 0.125 never drifts through floats.
  const f = (frac + '000').slice(0, 3);
  let cents = Number(whole || '0') * 100 + Number(f.slice(0, 2));
  if (Number(f[2]) >= 5) cents += 1;
  return neg ? -cents : cents;
}

function fmt(cents, opts = {}) {
  const neg = cents < 0;
  const abs = Math.abs(cents);
  const whole = Math.floor(abs / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const frac = String(abs % 100).padStart(2, '0');
  const body = opts.whole && abs % 100 === 0 ? `$${whole}` : `$${whole}.${frac}`;
  return neg ? `-${body}` : body;
}

// "21.5" -> 2150 basis points. Bad or out-of-range input -> null.
function pctToBps(v) {
  const s = String(v ?? '').replace(/[%\s]/g, '');
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  const bps = Math.round(Number(s) * 100);
  return bps >= 0 && bps <= 10000 ? bps : null;
}

function bpsToPct(bps) {
  return (bps / 100).toFixed(2).replace(/\.?0+$/, '');
}

function ymToIndex(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(ym || '');
  if (!m) return null;
  const month = Number(m[2]);
  if (month < 1 || month > 12) return null;
  return Number(m[1]) * 12 + month - 1;
}

function indexToYm(i) {
  return `${Math.floor(i / 12)}-${String((i % 12) + 1).padStart(2, '0')}`;
}

function monthLabel(ym) {
  const i = ymToIndex(ym);
  return `${MONTHS[i % 12]} ${Math.floor(i / 12)}`;
}

// ---------- the pieces of the math ----------

// Round half away from zero, on whole cents.
function share(cents, bps) {
  const sign = cents < 0 ? -1 : 1;
  return sign * Math.round((Math.abs(cents) * bps) / 10000);
}

// Base pay for month k (0-11) of the contract year. The twelve months always
// add up to the yearly figure exactly, so odd salaries don't leak pennies.
// 'full' pays the whole base across the year. 'half' is the classic ProSal
// setup: one guaranteed check a month (base / 24), the second check variable.
function drawForMonth(baseCents, drawMode, k) {
  const yearly = drawMode === 'half' ? Math.round(baseCents / 2) : baseCents;
  return Math.round((yearly * (k + 1)) / 12) - Math.round((yearly * k) / 12);
}

// One month of production against the contract's percentages.
function earnedFor(production = {}, ratesBps = {}) {
  const lines = [];
  let total = 0;
  let earned = 0;
  for (const c of CATEGORIES) {
    const p = production[c.id] || 0;
    const bps = ratesBps[c.id] || 0;
    const e = share(p, bps);
    lines.push({ id: c.id, label: c.label, production: p, bps, earned: e });
    total += p;
    earned += e;
  }
  return { lines, production: total, earned };
}

// ---------- the ledger ----------
//
// doc: {
//   name, baseCents, yearStart: 'YYYY-MM',
//   ratesBps: { services, lab, pharmacy, preventives, other },
//   period: 'monthly' | 'quarterly',   how often the bonus is figured
//   drawMode: 'full' | 'half',         how much of the base is paid out as you go
//   carry: boolean,                    carry a shortfall into the next period (negative accrual)
//   resetAtYearEnd: boolean,           wipe any carried shortfall when the contract year ends
// }
// entries: { 'YYYY-MM': { services, lab, pharmacy, preventives, other, basePaid? } } in cents
//
// A period is only settled when every month in it has numbers, and periods are
// settled in order. A missing month stops the ledger there, so a carried
// shortfall can never skip a month.
function runLedger(doc, entries = {}) {
  const start = ymToIndex(doc.yearStart);
  const out = { periods: [], years: [], carry: 0, ignored: [] };
  if (start == null) return out;

  let last = null;
  for (const ym of Object.keys(entries)) {
    const i = ymToIndex(ym);
    if (i == null) continue;
    if (i < start) { out.ignored.push(ym); continue; }
    if (last == null || i > last) last = i;
  }
  if (last == null) return out;

  const len = doc.period === 'quarterly' ? 3 : 1;
  let carry = 0;
  let stopped = false;
  let year = null;

  for (let p = 0; start + p * len <= last; p++) {
    const first = start + p * len;
    const yearNo = Math.floor((p * len) / 12);
    if (!year || year.no !== yearNo) {
      year = {
        no: yearNo, from: indexToYm(start + yearNo * 12), to: indexToYm(start + yearNo * 12 + 11),
        production: 0, earned: 0, basePaid: 0, bonus: 0, absorbed: 0,
        monthsSettled: 0, complete: false, trueUp: 0, forgiven: 0, paid: 0,
      };
      out.years.push(year);
    }

    const months = [];
    const lines = CATEGORIES.map((c) => ({ id: c.id, label: c.label, production: 0, bps: doc.ratesBps[c.id] || 0, earned: 0 }));
    let production = 0, earned = 0, basePaid = 0, entered = 0;
    for (let i = first; i < first + len; i++) {
      const ym = indexToYm(i);
      const e = entries[ym];
      const k = (i - start) % 12;
      const has = !!e;
      const m = { ym, has, production: 0, earned: 0, basePaid: 0 };
      if (has) {
        const r = earnedFor(e, doc.ratesBps);
        r.lines.forEach((l, j) => { lines[j].production += l.production; });
        m.production = r.production;
        m.earned = r.earned;
        m.basePaid = Number.isInteger(e.basePaid) ? e.basePaid : drawForMonth(doc.baseCents, doc.drawMode, k);
        production += m.production; basePaid += m.basePaid;
        entered++;
      }
      months.push(m);
    }
    // The percentage is taken once on the period's total for each category,
    // not month by month, so a quarter never drifts a cent from rounding.
    for (const l of lines) { l.earned = share(l.production, l.bps); earned += l.earned; }

    const label = len === 1
      ? monthLabel(months[0].ym)
      : `${monthLabel(months[0].ym)} to ${monthLabel(months[len - 1].ym)}`;
    const period = { label, yearNo, months, lines, production, earned, basePaid, carryIn: 0, bonus: 0, carryOut: 0, absorbed: 0, status: 'settled', yearEnd: null };

    if (stopped || entered < len) {
      // Not settled: either its own months are missing, or an earlier period is.
      period.status = entered < len ? 'open' : 'waiting';
      stopped = true;
      out.periods.push(period);
      continue;
    }

    period.carryIn = carry;
    const net = earned - basePaid - carry;
    if (net >= 0) {
      period.bonus = net;
      carry = 0;
    } else if (doc.carry) {
      carry = -net;
    } else {
      period.absorbed = -net;
      carry = 0;
    }
    period.carryOut = carry;

    year.production += production;
    year.earned += earned;
    year.basePaid += basePaid;
    year.bonus += period.bonus;
    year.absorbed += period.absorbed;
    year.monthsSettled += len;

    if (year.monthsSettled === 12) {
      // The guarantee is yearly: if base paid plus bonuses came to less than
      // the guaranteed base, the practice owes the difference.
      year.complete = true;
      year.trueUp = Math.max(0, doc.baseCents - (year.basePaid + year.bonus));
      if (doc.resetAtYearEnd) { year.forgiven = carry; carry = 0; }
      period.yearEnd = { trueUp: year.trueUp, forgiven: year.forgiven };
      period.carryOut = carry;
    }
    year.paid = year.basePaid + year.bonus + year.trueUp;
    out.periods.push(period);
  }

  out.carry = carry;
  return out;
}

// ---------- plain-English checks ----------
//
// Things worth a second look before the statement goes to the doctor. These
// are rules of thumb from the people who designed ProSal, not law.
function checks(doc, ledger, benefitsCents = 0) {
  const notes = [];
  const settled = ledger.periods.filter((p) => p.status === 'settled');

  let run = 0;
  for (const p of settled) run = p.carryOut > 0 ? run + 1 : 0;
  if (run >= 3) {
    notes.push({ level: 'warn', id: 'underwater', text: `A shortfall has been carried for ${run} periods in a row (${fmt(ledger.carry)} now). The base may be set higher than this doctor's production supports.` });
  }

  const y = ledger.years[ledger.years.length - 1];
  if (y && y.production > 0 && y.monthsSettled >= 3) {
    const paid = y.basePaid + y.bonus + y.trueUp;
    const withBenefits = paid + Math.round((benefitsCents * y.monthsSettled) / 12);
    const bps = Math.round((withBenefits * 10000) / y.production);
    if (bps > 2500) {
      notes.push({ level: 'warn', id: 'over25', text: `Pay${benefitsCents ? ' plus benefits' : ''} is running at ${bpsToPct(bps)}% of production this contract year. The usual ceiling is 25%.` });
    }
    if (y.complete && y.trueUp > 0) {
      notes.push({ level: 'info', id: 'trueup', text: `Year-end guarantee: base paid plus bonuses came to less than the guaranteed base, so ${fmt(y.trueUp)} is owed to bring the doctor up to it.` });
    }
  }

  const open = ledger.periods.find((p) => p.status === 'open');
  if (open) {
    const missing = open.months.filter((m) => !m.has).map((m) => monthLabel(m.ym)).join(', ');
    notes.push({ level: 'info', id: 'open', text: `Waiting on ${missing}. Nothing after that is settled until those numbers are in.` });
  }
  if (ledger.ignored.length) {
    notes.push({ level: 'info', id: 'ignored', text: `${ledger.ignored.length} month(s) before the contract year start are not counted.` });
  }
  return notes;
}

// One line per settled period, ready to paste into a payroll sheet.
function payrollCsv(docs, ledgers) {
  const rows = [['Doctor', 'Period', 'Production', 'Earned on production', 'Base paid', 'Shortfall carried in', 'Bonus due', 'Year-end guarantee owed', 'Shortfall carried out']];
  docs.forEach((d, i) => {
    for (const p of ledgers[i].periods) {
      if (p.status !== 'settled') continue;
      const c = (n) => (n / 100).toFixed(2);
      rows.push([d.name, p.label, c(p.production), c(p.earned), c(p.basePaid), c(p.carryIn), c(p.bonus), c(p.yearEnd ? p.yearEnd.trueUp : 0), c(p.carryOut)]);
    }
  });
  return rows.map((r) => r.map((v) => (/[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v)).join(',')).join('\n');
}

function b64(s) { return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64(s) { return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0))); }

function checkLink(d) {
  const pack = { v: 1, practice: S.practice || '', docs: [d] };
  return `${location.origin}${location.pathname}#check=${b64(JSON.stringify(pack))}`;
}

function readCheckLink() {
  const m = /^#check=([A-Za-z0-9_-]+)$/.exec(globalThis.location ? location.hash : '');
  if (!m) return null;
  try {
    const s = JSON.parse(unb64(m[1]));
    if (s.v !== 1 || !Array.isArray(s.docs) || !s.docs[0] || !s.docs[0].ratesBps) return null;
    checkMode = true;
    return s;
  } catch { return null; }
}

// ---------- license ----------

async function startLicense() {
  if (DEMO || checkMode || !location.protocol.startsWith('http')) return;
  const params = new URLSearchParams(location.search);
  const session = params.get('session_id');
  try {
    if (session) {
      const r = await (await fetch(`/api/claim?session_id=${encodeURIComponent(session)}`)).json();
      if (r.ok) { store.set(LIC, r.key); toast(`Thank you. ${r.name} is licensed.`); }
      else license.msg = r.error;
      history.replaceState(null, '', location.pathname + location.hash);
    }
    const key = store.get(LIC);
    if (key) await applyKey(key, false);
  } catch { /* offline or no server: stay on the free plan */ }
  render();
}

async function applyKey(key, loud) {
  let r;
  try { r = await (await fetch(`/api/check?key=${encodeURIComponent(key.trim())}`)).json(); }
  catch { r = { ok: false, reason: 'Could not check the key. Are you online?' }; }
  if (r.ok) {
    Object.assign(license, { paid: true, name: r.name, exp: r.exp, msg: '' });
    store.set(LIC, key.trim());
    if (loud) toast(`${r.name} is licensed.`);
  } else {
    Object.assign(license, { paid: false, msg: r.reason || 'That key did not work.' });
  }
  return r.ok;
}

function statement(d, ledger, p) {
  if (!d.baseCents && !p) {

  }
  if (!p) {
    return `<section class="sheet"><span class="eyebrow">Statement</span><p>Add the first month's production to see the statement.</p></section>`;
  }
  const settled = p.status === 'settled';
  const y = ledger.years.find((x) => x.no === p.yearNo);
  const shown = p.lines.some((l) => l.production !== 0) ? p.lines.filter((l) => l.production !== 0) : p.lines.slice(0, 1);
  const lines = shown.map((l) => `
    <div class="line"><div class="what">${l.label}<small>${fmt(l.production)} × ${bpsToPct(l.bps)}%</small></div><div class="amt">${fmt(l.earned)}</div></div>`).join('');
  const baseHow = `${fmt(d.baseCents, { whole: true })} a year${p.months.length > 1 ? `, ${p.months.length} months` : ''}${d.drawMode === 'half' ? ', half paid as you go' : ''}`;

  let result = '';
  if (!settled) {
    const missing = p.months.filter((m) => !m.has).map((m) => monthLabel(m.ym)).join(', ');
    result = `<div class="note warn">${p.status === 'open' ? `Not settled yet. Waiting on ${missing}.` : 'These numbers are in, but an earlier period is still missing a month. Periods settle in order.'}</div>`;
  } else {
    result = `<div class="line total ${p.bonus ? '' : 'zero'}"><div class="what">Production bonus due</div><div class="amt" id="bonus">${fmt(p.bonus)}</div></div>`;
    const short = p.basePaid + p.carryIn - p.earned;
    if (!p.bonus && d.carry && short > 0 && !(p.yearEnd && p.yearEnd.forgiven)) {
      result += `<div class="note warn">Production pay came to ${fmt(short)} less than base pay${p.carryIn ? ' plus the shortfall carried in' : ''}. That amount carries into the next period.</div>`;
    } else if (p.absorbed) {
      result += `<div class="note">Production pay came to ${fmt(p.absorbed)} less than base pay. Under this contract that is not carried forward.</div>`;
    }
    if (p.yearEnd) {
      if (p.yearEnd.trueUp) result += `<div class="line total"><div class="what">Year-end guarantee owed<small>guaranteed base less everything paid this contract year</small></div><div class="amt">${fmt(p.yearEnd.trueUp)}</div></div>`;
      if (p.yearEnd.forgiven) result += `<div class="note">Contract year closed. The ${fmt(p.yearEnd.forgiven)} shortfall still on the books is wiped.</div>`;
    }
  }

  const paid = y ? y.basePaid + y.bonus + y.trueUp : 0;

      <div style="text-align:right"><div class="eyebrow">${esc(S.practice || '')}</div><strong>${p.label}</strong></div>

function ledgerTable(d, ledger, picked) {
  if (!ledger.periods.length) return `<h2>Ledger</h2><p class="muted">Each settled period will show here, with what was carried in and out.</p>`;
  const rows = [];

    const nextP = ledger.periods[i + 1];
    const y = ledger.years.find((x) => x.no === p.yearNo);
    if ((!nextP || nextP.yearNo !== p.yearNo) && y && y.monthsSettled) {
      rows.push(`<tr class="yr"><td>${y.complete ? 'Contract year' : 'Contract year so far'}</td><td>${fmt(y.production)}</td><td>${fmt(y.earned)}</td><td>${fmt(y.basePaid)}</td><td></td><td>${fmt(y.bonus + y.trueUp)}</td><td></td></tr>`);
    }
  });
  return `<header><h2>Ledger: ${esc(d.name || 'Doctor')}</h2><span class="muted small noprint">Tap a row to see its statement</span></header>
    <div class="scroll"><table>
      <thead><tr><th>Period</th><th>Production</th><th>Earned</th><th>Base paid</th><th>Carried in</th><th>Bonus due</th><th>Carried out</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>`;
}

function plans() {
  if (DEMO) return '';
  const buy = CONFIG.buyUrl
    ? `<a class="btn" href="${esc(CONFIG.buyUrl)}">Get the practice license</a>`
    : '<span class="muted small">Not on sale yet.</span>';
  return `<section class="panel noprint" id="plans">
    <h2>${license.paid ? 'Your license' : 'Plans'}</h2>
    ${license.paid ? `<p>Licensed to <strong>${esc(license.name)}</strong> through ${new Date(license.exp).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}.</p>` : `
    <div class="plans">
      <div class="plan"><h3>Free</h3><div class="price">$0</div><ul><li>One doctor</li><li>Every line of the math on screen</li><li>The full year ledger</li></ul></div>
      <div class="plan best"><h3>Practice license</h3><div class="price">${esc(CONFIG.price)}</div><ul><li>Every doctor in the practice</li><li>Printable statements to hand over</li><li>A check link each doctor can open</li><li>Payroll lines to paste into your sheet</li></ul><p class="muted small">${esc(CONFIG.priceNote)}</p>${buy}</div>
    </div>
    <div class="q"><span>Already have a key?</span><div class="keyrow"><input type="text" id="key" placeholder="PL1...." autocomplete="off"><button class="btn ghost" data-act="key">Use key</button></div>${license.msg ? `<span style="color:var(--neg)">${esc(license.msg)}</span>` : ''}</div>`}
  </section>`;
}

function dataPanel() {
  if (DEMO) return '';
  return `<section class="panel noprint">
    <h2>Your data</h2>
    <p class="muted">Saved in this browser on this computer. Keep a backup file so a cleared browser doesn't cost you the year.</p>
    <div class="row"><button class="btn ghost" data-act="backup">Save a backup file</button><label class="btn quiet" for="restore">Load a backup file</label><input type="file" id="restore" accept="application/json,.json" hidden></div>
  </section>`;
}

function checkFooter() {
  return `<section class="panel noprint"><h2>Run your own practice's statements</h2><p class="muted">ProSal Ledger is free for one doctor.</p><div class="row"><a class="btn" href="${esc(location.pathname)}">Open ProSal Ledger</a></div></section>`;
}

let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

function needLicense() {
  if (license.paid) return false;
  toast('That comes with the practice license.');
  const el = $('#plans');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  return true;
}

async function copy(text, done) {
  try {
    await navigator.clipboard.writeText(text);
    toast(done);
  } catch {
    ui.copy = text;
    refresh();
    const box = $('#copybox');
    if (box) { box.focus(); box.select(); }
    toast('Select the text and copy it.');
  }
}

// ---------- events ----------

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const d = cur();
  if (act !== 'del-month' && act !== 'del-doc') ui.removing = false;
  if (act !== 'csv' && act !== 'link') ui.copy = null;

  if (act === 'start') {
    S = { v: 1, practice: '', docs: [blankDoc()] };
    ui.doc = S.docs[0].id; ui.month = null; ui.termsOpen = true;
    save(); render();
  } else if (act === 'doc') {
    ui.doc = el.dataset.id; ui.month = null; render();
  } else if (act === 'add-doc') {
    if (!S.example && S.docs.length >= 1 && needLicense()) return;
    const nd = blankDoc(); S.docs.push(nd); ui.doc = nd.id; ui.month = null; ui.termsOpen = true;
    save(); render();
  } else if (act === 'del-doc') {
    if (ui.removing !== 'doc') { ui.removing = 'doc'; render(); return; }
    S.docs = S.docs.filter((x) => x.id !== d.id); ui.doc = S.docs[0].id; ui.month = null; ui.removing = false;
    save(); render();
  } else if (act === 'set') {
    const v = el.dataset.v;
    d[el.dataset.k] = v === 'true' ? true : v === 'false' ? false : v;
    ui.termsOpen = true;
    save(); render();
  } else if (act === 'month' || act === 'period') {
    ui.month = el.dataset.ym; ui.termsOpen = $('#terms') ? $('#terms').open : ui.termsOpen;
    render();
    if (act === 'period') { const s = $('#sheet'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  } else if (act === 'add-month') {
    d.entries[el.dataset.ym] = {}; ui.month = el.dataset.ym; ui.termsOpen = $('#terms').open;
    save(); render();
    const first = $(`#m-${el.dataset.ym}-services`); if (first) first.focus();
  } else if (act === 'del-month') {
    if (ui.removing !== 'month') { ui.removing = 'month'; render(); return; }
    const months = monthsOf(d); delete d.entries[months[months.length - 1]]; ui.month = null; ui.removing = false;
    save(); render();
  } else if (act === 'print') {
    if (needLicense()) return;
    window.print();
  } else if (act === 'link') {
    if (needLicense()) return;
    copy(checkLink(d), "Link copied. Send it to the doctor.");
  } else if (act === 'csv') {
    if (needLicense()) return;
    copy(payrollCsv(S.docs, S.docs.map((x) => runLedger(x, x.entries))), 'Payroll lines copied. Paste them into your sheet.');
  } else if (act === 'key') {
    applyKey($('#key').value, true).then(render);
  } else if (act === 'backup') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = `prosal-ledger-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  const d = cur();
  if (el.id === 'key' || el.type === 'file') return;
  let ok = true;
  if (el.dataset.cat) {
    const e = d.entries[el.dataset.ym];
    const c = el.value.trim() === '' ? null : toCents(el.value);
    ok = el.value.trim() === '' || c !== null;
    if (ok) {
      if (el.dataset.cat === 'basePaid') { if (c === null) delete e.basePaid; else e.basePaid = c; }
      else e[el.dataset.cat] = c || 0;
    }
  } else if (el.dataset.rate) {
    const b = pctToBps(el.value);
    ok = b !== null;
    if (ok) d.ratesBps[el.dataset.rate] = b;
  } else if (el.dataset.k === 'baseCents' || el.dataset.k === 'benefitsCents') {
    const c = el.value.trim() === '' ? 0 : toCents(el.value);
    ok = c !== null && c >= 0;
    if (ok) d[el.dataset.k] = c;
  } else if (el.dataset.k === 'practice') {
    S.practice = el.value;
  } else if (el.dataset.k === 'name') {
    d.name = el.value;
    const chip = document.querySelector(`.chip[data-id="${d.id}"]`); if (chip) chip.textContent = el.value || 'New doctor';
  } else if (el.dataset.k === 'yearStart') {
    ok = ymToIndex(el.value) !== null;
    if (ok) d.yearStart = el.value;
  } else return;
  el.classList.toggle('bad', !ok);
  if (ok) { save(); refresh(); }
});

// Tidy a money box when you leave it: 39000 becomes 39,000.00.
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.type === 'file') {
    const f = el.files && el.files[0];
    if (!f) return;
    f.text().then((t) => {
      const s = JSON.parse(t);
      if (s.v !== 1 || !Array.isArray(s.docs) || !s.docs.length) throw new Error('bad');
      S = s; ui.doc = S.docs[0].id; ui.month = null; save(); render(); toast('Backup loaded.');
    }).catch(() => toast('That file is not a ProSal Ledger backup.'));
    return;
  }
  if (el.id === 't-start') { ui.termsOpen = true; render(); return; }
  if (!el.classList.contains('money')) return;
  const c = toCents(el.value);
  if (c !== null && el.value.trim() !== '') el.value = money(c);
  if (el.dataset.k === 'baseCents') { ui.termsOpen = true; render(); }
});

// Remember whether the contract terms are folded away.
document.addEventListener('toggle', (ev) => { if (ev.target.id === 'terms') ui.termsOpen = ev.target.open; }, true);

render();
startLicense();

</script>
