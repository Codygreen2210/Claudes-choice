<!-- How a cheetah runs. 1920x1080, 24 fps, clay look, all drawn by code (clay.js is the kit).
     The voice sets the clock (cues.js); clock.js turns that into how fast she is striding at each moment.
     The cheetah is a small rig: a bending spine, four legs solved from where the feet need to be, a tail that lags.
     Feet stay planted on the ground while they are down, so the stride covers real ground. -->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e6d3a8}canvas{display:block}</style>
<script src="../../studio/motion/kit.js"></script>
<script src="cues.js"></script>
<script src="clock.js"></script>
</head><body><canvas id="c" width="1920" height="1080"></canvas>

const cv = document.getElementById('c'), g = cv.getContext('2d')
const W = 1920, H = 1080, cue = CLOCK.cue, DUR = CUES.dur
const F = (w, px) => `${w} ${px}px "Inter Display", Inter, system-ui, sans-serif`
let T = 0, TS = 0, BOIL = 0
</script>
<script src="clay.js"></script>
<script>
window.__duration = DUR
let paper = null
window.__init = async () => {
  await Promise.all([document.fonts.load(F(800, 80)), document.fonts.load(F(700, 40)), document.fonts.load(F(600, 30))])
  paper = speckle(480, 270, 9000, [[60, 40, 20, 0.05], [255, 250, 235, 0.06]], 2.2)
}
function pop(t0, out) {
  let s = TS < t0 ? 0 : EZ.back(clamp((TS - t0) / 0.42))

const sm = p => p < 0 ? 0 : p > 1 ? 1 : p * p * (3 - 2 * p)
const GOLD = [38, 74, 60], GOLD_FAR = [34, 62, 44], BONE = [45, 34, 90], MUSCLE = [358, 62, 52], DARK = [28, 40, 14]
const GY = 830                              // ground line on screen

// ------------------------------------------------------------------ the rig
// two-bone leg: joint J, target T, lengths a and b, bend = +1 knee forward / -1 elbow back
function ik(J, Tg, a, b, bend) {
  let dx = Tg[0] - J[0], dy = Tg[1] - J[1], d = Math.hypot(dx, dy)

const gather = ph => 0.5 - 0.5 * Math.cos(2 * Math.PI * (ph - 0.30))        // 0 stretched out, 1 tucked up
// the pose at stride phase ph (0..1), blended with standing by run (0..1). Units: 1 = one drawing unit; feet at y = 0.
function pose(ph, run) {

  const d = 300 * (1 - 0.2 * g1) + 14 * (1 - g1) * run
  const Hp = [S[0] - d, -250 + bob - 10 * g1 + 16 * (1 - g1) * run * 0.3]
  const arch = lerp(6, -14 + 86 * g1, run)

  const defs = [['hind', 0.07, true], ['fore', 0.07, true], ['hind', 0, false], ['fore', 0, false]]

    const J0 = hind ? Hp : Sj
    let since = ((p - td) % 1 + 1) % 1, fx, fy, stance = since < len, sw = 0

    else { sw = (since - len) / (1 - len); const e = sw < 0.5 ? 2 * sw * sw : 1 - 2 * (1 - sw) * (1 - sw); fx = lerp(offX, landX, e) + (J0[0] - jointAt(p + off)) * 0; fy = -lift * Math.sin(Math.PI * sw) - (hind ? 26 : 34) * Math.sin(Math.PI * sw) ** 2 }
    // standing: feet straight under the joints
    const standX = hind ? Hp[0] + (far ? -14 : 6) - 22 : Sj[0] + (far ? -10 : 8)
    fx = lerp(standX, fx, run); fy *= run

  for (let k = 1; k <= 3; k++) { const an = Math.atan2(ny, nx) - k * Math.PI / 4; pts.push([b[0] + Math.cos(an) * wb / 2, b[1] + Math.sin(an) * wb / 2]) }
  for (let i = n; i >= 0; i--) { const u = i / n, w = lerp(wa, wb, u) / 2; pts.push([a[0] + dx * u - nx * w, a[1] + dy * u - ny * w]) }
  for (let k = 1; k <= 3; k++) { const an = Math.atan2(-ny, -nx) - k * Math.PI / 4; pts.push([a[0] + Math.cos(an) * wa / 2, a[1] + Math.sin(an) * wa / 2]) }

function drawLeg(L, o) {

  const w = hind ? [[64, 40], [34, 20], [18, 14]] : [[50, 34], [30, 20], [17, 14]]
  for (let i = 0; i < 3; i++) clay(capsule(j[i], j[i + 1], w[i][0], w[i][1], sd + i), col, { seed: sd + i, shadow: false, alpha: o.alpha })
  clay(blob(j[3][0] + 8, j[3][1] - 7, 17, 10, sd + 5, 0.04, 10), col, { seed: sd + 5, shadow: false, alpha: o.alpha })
  if (o.claws) { g.fillStyle = '#2b1a10'; for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(j[3][0] + 14 + k * 5, j[3][1] - 6); g.lineTo(j[3][0] + 24 + k * 5, j[3][1] - 1); g.lineTo(j[3][0] + 12 + k * 5, j[3][1] - 1); g.fill() } }
}
const SPOTS = (() => { const r = rng(4242), a = []; for (let i = 0; i < 46; i++) a.push([0.04 + r() * 0.92, -0.75 + r() * 1.6, 5 + r() * 4.5]); return a })()

  const air = P.legs.every(L => !L.stance) && run > 0.5

  if (o.collar) { g.save(); g.globalAlpha = skin; clay(capsule([P.S[0] + 64, P.S[1] - 34], [P.S[0] + 92, P.S[1] + 22], 15, 15, 531), [205, 50, 42], { seed: 531, shadow: false }); ball(P.S[0] + 96, P.S[1] + 26, 9, [24, 20, 22], 532); g.restore() }
  clay(blob(hd[0], hd[1], 40, 33, 533, 0.04, 14), GOLD, { seed: 533, shadow: false, alpha: skin })
  clay(blob(hd[0] + 31, hd[1] + 9, 20, 16, 534, 0.04, 10), BONE, { seed: 534, shadow: false, alpha: skin })
  clay(blob(hd[0] - 18, hd[1] - 30, 12, 13, 535, 0.05, 8), GOLD_FAR, { seed: 535, shadow: false, alpha: skin })
  g.save(); g.globalAlpha = skin
  g.fillStyle = '#1c1210'; g.beginPath(); g.arc(hd[0] + 12, hd[1] - 6, 5.4, 0, 6.283); g.fill(); g.beginPath(); g.ellipse(hd[0] + 48, hd[1] + 5, 5, 4, 0, 0, 6.283); g.fill()

    // spine beads, neck, skull
    for (let i = 0; i <= 12; i++) ball(sp[i][0], sp[i][1] + 6, 10.5, BONE, 540 + i)
    for (let i = 1; i <= 3; i++) ball(lerp(P.S[0] + 16, hd[0] - 22, i / 3.2), lerp(P.S[1] + 2, hd[1] + 6, i / 3.2), 9.5, BONE, 556 + i)
    clay(blob(hd[0] + 6, hd[1] + 1, 28, 21, 560, 0.04, 12), BONE, { seed: 560, shadow: false })
    // pelvis and limb bones (near side)
    clay(blob(P.Hp[0] + 4, P.Hp[1] + 20, 34, 18, 561, 0.05, 10), BONE, { seed: 561, shadow: false })
    for (const L of P.legs) if (!L.far) { g.strokeStyle = 'rgba(250,240,215,0.96)'; g.lineWidth = 10; g.lineJoin = 'round'; g.beginPath(); L.joints.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); L.joints.forEach((p, i) => { if (i < 3) ball(p[0], p[1], 8, BONE, 565 + i) }) }

    const slide = (ua - 1.9) * 26 * run

// ------------------------------------------------------------------ the set
function ground(dist, o = {}) {

  g.save(); g.scale(4, 4); g.globalAlpha = 0.9; g.fillStyle = g.createPattern(paper, 'repeat'); g.translate((BOIL % 3) * 7, (BOIL % 2) * 5); g.fillRect(-20, -20, 520, 320); g.restore()
  // grass tufts and stones ride past at ground speed

function caption(cx, maxw) {

    let acc = 0, text = parts[parts.length - 1].trim(); const u = clamp((T - c.t0) / (c.t1 - c.t0))
    for (const p of parts) { acc += p.length; if (u <= acc / total) { text = p.trim(); break } }
    g.font = F(600, 34); const words = text.split(' '), lines = []; let cur = ''
    for (const w of words) { const nx = cur ? cur + ' ' + w : w; if (g.measureText(nx).width > maxw && cur) { lines.push(cur); cur = w } else cur = nx }
    lines.push(cur); const y0 = 1034 - (lines.length - 1) * 44
    g.textAlign = 'center'; g.textBaseline = 'middle'
    lines.forEach((ln, i) => { const w = g.measureText(ln).width + 44; g.fillStyle = 'rgba(43,26,14,0.84)'; g.beginPath(); g.roundRect(cx - w / 2, y0 + i * 44 - 22, w, 44, 12); g.fill(); g.fillStyle = '#fff3d9'; g.fillText(ln, cx, y0 + i * 44 + 1) })

function hat(x, y, sc) {                       // the host's field hat
  g.save(); g.translate(x, y); g.scale(sc, sc)

  clay(capsule([-70, -86], [70, -86], 12, 12, 702), [22, 44, 30], { seed: 702, shadow: false }); g.restore()
}
// the chase seen from above: she follows the prey through its turns, tail swinging to the outside
function topView(t0) {
  const tt = TS - t0, path = u => [300 + u * 1320, 470 + 190 * Math.sin(u * 7.2) * (0.5 + 0.5 * Math.sin(u * 2.3 + 1))]
  const period = 6.2, u = (tt % period) / period, lead = 0.2
  g.fillStyle = '#d2b06e'; g.fillRect(0, 0, W, H); g.save(); g.scale(4, 4); g.fillStyle = g.createPattern(paper, 'repeat'); g.fillRect(0, 0, 480, 270); g.restore()
  const r = rng(7); for (let k = 0; k < 30; k++) { const x = r() * W, y = 120 + r() * 800; clay(blob(x, y, 16 + r() * 16, 10 + r() * 8, 900 + k, 0.1, 9), r() < 0.6 ? [84, 36, 44] : [30, 16, 52], { seed: 900 + k, shadow: false }) }
  // her track, in dust
  g.strokeStyle = 'rgba(255,246,220,0.5)'; g.lineWidth = 7; g.setLineDash([4, 22]); g.lineCap = 'round'; g.beginPath(); for (let k = 0; k <= 80; k++) { const p = path(k / 80 * (u + lead)); k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]) } g.stroke(); g.setLineDash([])
  const at = (uu, draw) => { const p = path(uu), q = path(uu + 0.004), b = path(uu - 0.004), ang = Math.atan2(q[1] - p[1], q[0] - p[0]), a0 = Math.atan2(p[1] - b[1], p[0] - b[0]); let turn = ang - a0; turn = Math.atan2(Math.sin(turn), Math.cos(turn)); g.save(); g.translate(p[0], p[1]); g.rotate(ang); g.scale(1.7, 1.7); draw(turn * 26); g.restore() }
  at(u + lead, () => { clay(blob(0, 0, 44, 22, 950, 0.05, 12), [30, 46, 62], { seed: 950 }); clay(blob(40, 0, 18, 13, 951, 0.05, 10), [30, 46, 62], { seed: 951, shadow: false }); g.strokeStyle = '#2b1a10'; g.lineWidth = 4; g.lineCap = 'round'; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(46, s * 7); g.lineTo(28, s * 15); g.stroke() } })
  at(u, turn => {
    const sw = clamp(-turn * 1.5, -1.05, 1.05), ph = tt * 3.1
    // tail first, so it sits under the hips
    const tp = [[-92, 0]]; for (let i = 1; i <= 6; i++) tp.push([-92 - i * 30 * Math.cos(sw * i / 6), -i * 30 * Math.sin(sw * i / 6) * 1.1])
    for (let i = 0; i < 6; i++) clay(capsule(tp[i], tp[i + 1], 20 - i * 2, 18 - i * 2, 960 + i), i > 3 ? (i % 2 ? DARK : BONE) : GOLD, { seed: 960 + i, shadow: i === 0 })
    for (const [lx, ly, off] of [[62, 30, 0], [62, -30, 0.5], [-70, 32, 0.25], [-70, -32, 0.75]]) { const st = Math.sin(ph * 6.283 + off * 6.283) * 26; clay(blob(lx + st, ly, 20, 10, 970 + lx + ly, 0.04, 8), GOLD_FAR, { seed: 970, shadow: false }) }
    clay(blob(-10, 0, 112, 38 + 4 * Math.sin(ph * 6.283), 980, 0.04, 16), GOLD, { seed: 980 })
    const rs = rng(55); g.fillStyle = '#2f1e12'; for (let k = 0; k < 26; k++) { g.beginPath(); g.ellipse(-100 + rs() * 180, (rs() - 0.5) * 54, 6, 5, 0, 0, 6.283); g.fill() }
    clay(blob(112, turn * 0.2, 34, 28, 981, 0.04, 12), GOLD, { seed: 981, shadow: false })
    for (const s of [-1, 1]) clay(blob(96, s * 22, 9, 8, 982 + s, 0.04, 8), GOLD_FAR, { seed: 982, shadow: false })
  })
}

// ------------------------------------------------------------------ the film
window.__seek = t => {
  T = t; TS = Math.floor(t * 12 + 1e-6) / 12; BOIL = Math.floor(t * 6 + 1e-6)
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1
  const ph = CLOCK.phase(t), run = CLOCK.run(t)         // she moves on every frame; the clay around her moves on twos
  const c = cue, inTurn = t >= c.turn.t0 - 0.1 && t < c.short.t0 - 0.1
  let look = [0.8, -0.2], hostAt = [210, 900, 0.74]
  if (inTurn) {
    topView(c.turn.t0)
    tag('seen from above', 960, 80, { size: 30, col: C.cream, weight: 600, s: pop(c.turn.t0 + 0.2, c.short.t0 - 0.5) })
    tag('tail swings to the outside of the turn', 960, 900, { size: 38, col: C.mustard, s: pop(c.tail.t0 + 0.6, c.grip.t0 - 0.2) })
    tag('grip and turning beat top speed', 960, 900, { size: 40, col: C.mustard, s: pop(c.grip.t0 + 1.4, c.short.t0 - 0.5) })
    tag('collar study: 367 runs, 5 wild cheetahs', 960, 985, { size: 26, col: C.cream, weight: 600, s: pop(c.grip.t0 + 2.2, c.short.t0 - 0.45) })
  } else {
    // camera: how big she is, and where she stands on screen
    const zoomIn = Math.max(sm((t - (c.inside.t0 - 0.3)) / 1.0) * (1 - sm((t - (c.claws.t0 - 0.4)) / 0.8)), 0)
    const feet = sm((t - (c.claws.t0 - 0.3)) / 0.8) * (1 - sm((t - (c.turn.t0 - 0.6)) / 0.5))
    const wide = sm((t - (c.stride.t0 - 0.2)) / 0.9) * (1 - sm((t - (c.air.t0 + 0.3)) / 0.9))       // pull back to fit a whole stride
    const sc = lerp(lerp(lerp(1.12, 1.5, zoomIn), 1.2, feet), 0.74, wide) * lerp(1.2, 1, sm((t - c.go.t0) / 1.2))
    const cx = lerp(lerp(lerp(880, 820, zoomIn), 900, feet), 1420, wide), cy = lerp(GY, GY + 110, zoomIn)
    const dist = ph * CLOCK.STRIDE_PX * sc
    ground(dist)
    // the stride, measured out in yarn on the ground
    const st0 = c.stride.t0 + 1.3, rul = pop(st0, c.air.t0 + 0.2)
    if (rul > 0) {
      const p0 = CLOCK.phase(st0), x0 = cx + 330 * sc - (ph - p0) * CLOCK.STRIDE_PX * sc, len = CLOCK.STRIDE_PX * sc     // from where her nose was
      const shown = clamp((CLOCK.phase(t) - p0)) * len
      yarn(x0, GY + 70, x0 + Math.max(20, shown), GY + 70, 16, { seed: 300, th: 13 })
      tag('one stride: about 7 metres', x0 + len / 2, GY + 140, { size: 34, col: C.cream, s: pop(c.stride.t0 + 3.0, c.air.t0 + 0.2) })
      // a pickup, to scale against the yarn (5.8 m of the 7)
      const tr = pop(c.stride.t0 + 4.7, c.air.t0 + 0.15)
      if (tr > 0) { g.save(); g.translate(x0, GY + 30); g.scale(tr, tr); const L = len * 5.8 / 7
        clay(slab(0, -92, L, 60, 16, 310, 2), C.teal, { seed: 310 }); clay(slab(L * 0.42, -150, L * 0.3, 66, 18, 311, 2), C.teal, { seed: 311, shadow: false })
        clay(slab(L * 0.46, -138, L * 0.22, 38, 8, 312, 1), [200, 40, 82], { seed: 312, shadow: false }); ball(L * 0.2, -24, 34, C.dark, 313); ball(L * 0.8, -24, 34, C.dark, 314); g.restore() }
    }
    const xray = Math.max(sm((t - (c.inside.t0 + 1.2)) / 0.9) * (1 - sm((t - (c.claws.t0 - 0.5)) / 0.6)), 0)
    const mus = sm((t - (c.muscle.t0 + 0.2)) / 0.8) * (1 - sm((t - (c.shoulder.t0 - 0.4)) / 0.6))
    const P = cheetah(cx, cy, ph, run, { scale: sc, xray, muscle: mus, hiSpine: t > c.spine.t0 && t < c.muscle.t0, hiMuscle: mus > 0.5, hiBlade: t > c.shoulder.t0 + 0.3 && t < c.claws.t0 - 0.5, collar: t < c.slow.t0 + 0.5, claws: true })
    // speed lines at full tilt
    const fast = clamp((CLOCK.rate(t) - 1.5) / 1.5)
    if (fast > 0) { const r = rng(Math.floor(t * 24)); g.strokeStyle = `rgba(255,248,225,${0.5 * fast})`; g.lineCap = 'round'; for (let k = 0; k < 14; k++) { const y = GY - 420 + r() * 400, x = r() * W, L = 80 + r() * 260; g.lineWidth = 3 + r() * 5; g.beginPath(); g.moveTo(x, y); g.lineTo(x - L, y); g.stroke() } }
    // ---- labels, scene by scene
    tag('cheetah', 1180, 250, { size: 54, col: C.mustard, weight: 800, s: pop(c.who.t0 + 0.5, c.go.t0 - 0.1) })
    tag('fastest animal on land', 1180, 350, { size: 34, col: C.cream, s: pop(c.who.t0 + 1.9, c.go.t0 - 0.05) })
    tag('58 mph', 960, 150, { size: 84, col: C.mustard, weight: 800, s: pop(c.speed.t0 + 3.6, c.slow.t0 - 0.1) })
    tag('93 km/h, measured on a wild cheetah', 960, 270, { size: 30, col: C.cream, weight: 600, s: pop(c.speed.t0 + 4.3, c.accel.t0 + 1.4) })
    tag('0 to 45 mph in about 2.5 seconds', 960, 270, { size: 38, col: C.cream, s: pop(c.accel.t0 + 2.2, c.slow.t0 - 0.05) })
    tag('slowed down', 250, 90, { size: 30, col: C.brick, weight: 600, s: pop(c.slow.t0 + 0.6, c.claws.t0 - 0.3) })
    const a1 = c.air.t0 + 2.3, a2 = c.air.t0 + (c.air.t1 - c.air.t0) * 0.62 + 0.7
    tag('all four feet off the ground', 960, 150, { size: 44, col: C.mustard, weight: 800, s: pop(c.air.t0 + 1.4, c.inside.t0 - 0.2) })
    tag('1. stretched out', 700, 260, { size: 34, col: C.cream, s: pop(a1, c.inside.t0 - 0.15) })
    tag('2. tucked up', 1220, 260, { size: 34, col: C.cream, s: pop(a2, c.inside.t0 - 0.1) })
    tag('the spine: a spring', 1420, 160, { size: 46, col: C.mustard, weight: 800, s: pop(c.spine.t0 + 0.4, c.muscle.t0 - 0.2) })
    tag('bends like a bow', 1420, 265, { size: 32, col: C.cream, s: pop(c.spine.t0 + 2.0, c.muscle.t0 - 0.15) })
    tag('snaps straight, and adds reach', 1420, 350, { size: 32, col: C.cream, s: pop(c.spine.t0 + 3.6, c.muscle.t0 - 0.1) })
    tag('the engines', 1440, 160, { size: 46, col: C.brick, weight: 800, s: pop(c.muscle.t0 + 0.8, c.shoulder.t0 - 0.2) })
    tag('high on the back legs', 1440, 265, { size: 32, col: C.cream, s: pop(c.muscle.t0 + 2.4, c.power.t0 - 0.1) })
    tag('and all along the spine', 1440, 350, { size: 32, col: C.cream, s: pop(c.muscle.t0 + 4.2, c.power.t0 - 0.05) })
    // power, pound for pound: two clay bars
    const pw = pop(c.power.t0 + 0.6, c.shoulder.t0 - 0.2)
    if (pw > 0) { const grow = clamp((TS - c.power.t0 - 1.2) / 1.2); g.save(); g.translate(1180, 250); g.scale(pw * 1.35, pw * 1.35)
      clay(slab(0, 0, 420, 54, 16, 320, 1.6), C.sky, { seed: 320 }); clay(slab(0, 78, Math.max(40, 420 * 4 * grow / 4 + 0), 54, 16, 321, 1.6), C.brick, { seed: 321 })
      clay(slab(0, 0, 105, 54, 16, 322, 1.6), C.navy, { seed: 322, shadow: false })
      g.font = F(700, 26); g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#fff3d9'; g.fillText('fastest human sprinter', 118, 28); g.fillText('cheetah: about 4x', 18, 106); g.restore() }
    tag('shoulder blades slide', 1420, 170, { size: 44, col: C.mustard, weight: 800, s: pop(c.shoulder.t0 + 3.4, c.claws.t0 - 0.4) })
    tag('no collarbone holding them', 1420, 275, { size: 32, col: C.cream, s: pop(c.shoulder.t0 + 1.0, c.claws.t0 - 0.35) })
    // feet: two paws seen from below, claws in and claws out
    const pawS = pop(c.claws.t0 + 1.7, c.turn.t0 - 0.4)
    if (pawS > 0) for (const [k, px, lab, out] of [[0, 1180, 'house cat: claws in', false], [1, 1560, 'cheetah: claws out', true]]) {
      const s = Math.min(pawS, pop(c.claws.t0 + 1.7 + k * 1.6, c.turn.t0 - 0.4)); if (s <= 0) continue
      g.save(); g.translate(px, 300); g.scale(s, s)
      clay(blob(0, 0, 150, 150, 330 + k, 0.03, 18), C.navy, { seed: 330 + k })
      clay(blob(0, 34, 62, 50, 332 + k, 0.06, 12), out ? GOLD : [30, 20, 60], { seed: 332 + k, shadow: false })
      for (let i = 0; i < 4; i++) { const a = -2.2 + i * 0.42, tx = Math.cos(a) * 82, ty = 30 + Math.sin(a) * 88
        if (out) { g.fillStyle = '#f4ead2'; g.beginPath(); g.moveTo(tx + Math.cos(a) * 48, ty + Math.sin(a) * 48); g.lineTo(tx - Math.sin(a) * 9, ty + Math.cos(a) * 9); g.lineTo(tx + Math.sin(a) * 9, ty - Math.cos(a) * 9); g.fill() }
        clay(blob(tx, ty, 25, 29, 334 + k * 5 + i, 0.05, 10), out ? GOLD : [30, 20, 60], { seed: 334 + i, shadow: false }) }
      g.restore(); tag(lab, px, 500, { size: 30, col: out ? C.mustard : C.cream, s })
    }
    tag('like spikes on a running shoe', 1370, 590, { size: 32, col: C.cream, s: pop(c.claws.t0 + 4.6, c.turn.t0 - 0.35) })
    // the chase ends
    tag('a typical chase: under 200 metres', 1100, 160, { size: 42, col: C.mustard, weight: 800, s: pop(c.short.t0 + 2.4, c.sum.t0 - 0.3) })
    tag('wild average: 173 m', 1100, 265, { size: 30, col: C.cream, weight: 600, s: pop(c.short.t0 + 3.6, c.myth.t0 - 0.1) })
    tag('"they stop because they overheat"', 1100, 265, { size: 32, col: C.cream, s: pop(c.myth.t0 + 0.4, c.sum.t0 - 0.25) })
    tag('measured in 2013: not true', 1100, 355, { size: 34, col: C.brick, s: pop(c.myth.t0 + 4.2, c.sum.t0 - 0.2) })
    const sumT = [['a spring for a spine', 0.9], ['engines at the back', 2.3], ['spikes on her feet', 3.6], ['a rudder behind', 4.7]]
    const endAt = c.bye.t1 + 0.7
    sumT.forEach(([txt, dt], i) => tag(txt, 1240, 150 + i * 96, { size: 38, col: [C.mustard, C.brick, C.cream, C.sky][i], left: true, s: pop(c.sum.t0 + dt, endAt - 0.2 + i * 0.03), seed: 340 + i }))
    if (TS > endAt) {
      tag('How a cheetah runs', 1280, 170, { size: 60, col: C.mustard, weight: 800, s: pop(endAt + 0.1) })
      tag('made by Claude, an AI. checked by a person.', 1280, 290, { size: 30, col: C.cream, s: pop(endAt + 0.4) })
      tag('sources: Wilson 2013 (Nature), Hudson 2012, Hetem 2013,', 1280, 380, { size: 22, col: C.cream, weight: 600, s: pop(endAt + 0.7) })
      tag('Smithsonian’s National Zoo', 1280, 440, { size: 22, col: C.cream, weight: 600, s: pop(endAt + 0.8) })
    }
    if (t < c.go.t0) { hostAt = [330, 880, 1.0]; look = [1, -0.4] }
  }
  const hostIn = EZ.back(clamp((TS - 0.3) / 0.5))
  lump(hostAt[0], hostAt[1], hostAt[2] * hostIn, { lookX: look[0], lookY: look[1] })
  hat(hostAt[0], hostAt[1], hostAt[2] * hostIn)
  const vg = g.createRadialGradient(960, 500, 560, 960, 540, 1200); vg.addColorStop(0, 'rgba(60,35,10,0)'); vg.addColorStop(1, 'rgba(60,35,10,0.28)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  caption(960, 1150)
  const blk = Math.max(1 - clamp(t / 0.4), clamp((t - (DUR - 1.0)) / 0.9))
  if (blk > 0) { g.fillStyle = `rgba(0,0,0,${blk})`; g.fillRect(0, 0, W, H) }
}
